<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const now=()=>new Date();
const isoAgo=m=>new Date(Date.now()-m*60000).toISOString();
const fmtTime=v=>v?new Date(v).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const fmtDate=v=>v?new Date(v).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={tempThreshold:38,minFlow:18,pressureMin:95,pressureMax:190,staleMinutes:45,notifications:true,profileName:'Aulia Rahma Hanum',profileRole:'Operator Demo'};
let settings={...defaults};try{settings={...defaults,...JSON.parse(localStorage.getItem('rimbara-settings')||'{}')}}catch{}
const deviceSeed=[
{id:'N01',zone:'Blok Gambut A',temp:32.4,flow:48,pressure:152,comm:'online',sensor:'normal',age:2,x:22,y:30,depth:'20 cm'},
{id:'N02',zone:'Blok Gambut A',temp:36.8,flow:42,pressure:145,comm:'online',sensor:'normal',age:4,x:43,y:23,depth:'20 cm'},
{id:'N03',zone:'Blok Gambut B',temp:39.2,flow:12,pressure:88,comm:'online',sensor:'normal',age:3,x:62,y:48,depth:'30 cm'},
{id:'N04',zone:'Blok Gambut B',temp:34.1,flow:51,pressure:159,comm:'online',sensor:'normal',age:5,x:77,y:28,depth:'20 cm'},
{id:'N05',zone:'Blok Gambut C',temp:31.7,flow:0,pressure:0,comm:'offline',sensor:'unknown',age:130,x:34,y:70,depth:'30 cm'},
{id:'N06',zone:'Blok Gambut C',temp:37.4,flow:23,pressure:181,comm:'online',sensor:'normal',age:7,x:71,y:75,depth:'40 cm'}
];
let devices=deviceSeed.map(d=>({...d,lastUpdate:isoAgo(d.age),history:Array.from({length:24},(_,i)=>({t:new Date(Date.now()-(23-i)*15*60000).toISOString(),temp:+(d.temp+Math.sin(i*.42+d.x)*1.15+(i/23)*.4).toFixed(1),flow:Math.max(0,+(d.flow+Math.cos(i*.5+d.y)*4).toFixed(1)),pressure:Math.max(0,+(d.pressure+Math.sin(i*.4)*7).toFixed(1))}))}));
// Koordinat demonstrasi berada di kawasan gambut sekitar Taman Nasional Sebangau, Kalimantan Tengah.
// Ini bukan titik pemasangan terverifikasi; ubah melalui formulir koordinat setelah survei lapangan.
const demoCenter={lat:-2.45,lng:113.82,label:'Kawasan gambut Sebangau (wilayah demonstrasi)'};
let geoCenter={...demoCenter};try{geoCenter={...demoCenter,...JSON.parse(localStorage.getItem('rimbara-map-center')||'{}')}}catch{}
let savedLocations={};try{savedLocations=JSON.parse(localStorage.getItem('rimbara-device-locations')||'{}')}catch{}
const demoCoords={N01:[-2.438,113.798],N02:[-2.446,113.824],N03:[-2.461,113.836],N04:[-2.432,113.849],N05:[-2.472,113.811],N06:[-2.455,113.866]};
deviceSeed.forEach(d=>{const c=savedLocations[d.id]||{lat:demoCoords[d.id][0],lng:demoCoords[d.id][1],note:'Koordinat contoh demonstrasi'};d.lat=Number(c.lat);d.lng=Number(c.lng);d.locationNote=c.note||'Koordinat contoh demonstrasi'});
let leafletMap=null,leafletMarkers={},leafletLayer=null,geoSearchTimer=null;
function deviceCoords(d){const c=savedLocations[d.id]||{lat:d.lat,lng:d.lng,note:d.locationNote||'Koordinat contoh demonstrasi'};return c}
function saveDeviceCoord(id,lat,lng,note){savedLocations[id]={lat,lng,note};localStorage.setItem('rimbara-device-locations',JSON.stringify(savedLocations));let d=devices.find(x=>x.id===id),seed=deviceSeed.find(x=>x.id===id);if(d){d.lat=lat;d.lng=lng;d.locationNote=note}if(seed){seed.lat=lat;seed.lng=lng;seed.locationNote=note}addActivity('Lokasi perangkat diubah',id,`Koordinat disimpan: ${lat.toFixed(6)}, ${lng.toFixed(6)} (${note})`)}
function markerColor(d){let st=statusOf(d);return st==='normal'?'#2d8a58':st==='attention'?'#d69520':st==='critical'?'#c34545':'#7f8a83'}
function makePinIcon(d){return L.divIcon({className:'',html:`<div class="geo-pin" style="background:${markerColor(d)}" title="${esc(d.id)}"></div>`,iconSize:[21,21],iconAnchor:[10,10]})}
function activeAlertFor(id){return alerts.find(a=>a.deviceId===id&&a.status!=='Selesai')}
function popupContent(d){let c=deviceCoords(d),a=activeAlertFor(d.id);return `<div class="geo-popup"><h3>${esc(d.id)} · ${esc(d.zone)}</h3><p><b>Status:</b> ${esc(statusLabel(statusOf(d)))}</p><p><b>Suhu tanah:</b> ${d.comm==='offline'?'Data terakhir tidak ditampilkan':d.temp.toFixed(1)+' °C'}</p><p><b>Debit air:</b> ${d.comm==='offline'?'—':d.flow.toFixed(1)+' L/menit'}</p><p><b>Tekanan air:</b> ${d.comm==='offline'?'—':d.pressure.toFixed(1)+' kPa'}</p><p><b>Pembaruan:</b> ${esc(fmtTime(d.lastUpdate))}</p><p><b>Koordinat:</b> ${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}</p><p><b>Sumber:</b> DATA SIMULASI · lokasi contoh</p>${a?`<p style="color:#ad3434"><b>Indikasi aktif:</b> ${esc(a.type)}</p>`:''}<button class="btn primary" onclick="window.rimbaraDeviceDetail('${d.id}')">Lihat Detail</button>${a?`<button class="btn" onclick="window.rimbaraAlertDetail('${a.id}')">Lihat Peringatan</button>`:''}</div>`}
window.rimbaraDeviceDetail=id=>{selectedDevice=id;deviceFilter='all';window.deviceSearchVal=id;goto('devices');setTimeout(()=>deviceDetail(id),50)};
window.rimbaraAlertDetail=id=>{goto('alerts');setTimeout(()=>alertDetail(id),50)};
function initGeoMap(){const el=$('#geoMap');if(!el)return;if(leafletMap){leafletMap.remove();leafletMap=null;leafletMarkers={}}if(typeof L==='undefined'){el.innerHTML='<div class="empty"><strong>Peta geografis tidak dapat dimuat.</strong><br>Leaflet gagal diunduh. Periksa koneksi internet atau pemblokir CDN, lalu muat ulang halaman.</div>';return}
try{leafletMap=L.map(el,{scrollWheelZoom:true}).setView([geoCenter.lat,geoCenter.lng],12);leafletLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>',crossOrigin:true});let tileFailed=false;leafletLayer.on('tileerror',()=>{if(tileFailed)return;tileFailed=true;const msg=$('#tileStatus');if(msg)msg.textContent='Sebagian tile peta gagal dimuat. Periksa koneksi internet; marker simulasi tetap tersedia.'});leafletLayer.on('load',()=>{const msg=$('#tileStatus');if(msg)msg.textContent='Peta dasar OpenStreetMap dimuat. Marker perangkat tetap berlabel simulasi.'});leafletLayer.addTo(leafletMap);
const visible=devices.filter(d=>(mapFilter==='all'||statusOf(d)===mapFilter)&&(!window.mapSearchVal||(d.id+' '+d.zone).toLowerCase().includes(window.mapSearchVal.toLowerCase())));visible.forEach(d=>{const c=deviceCoords(d);if(!Number.isFinite(c.lat)||!Number.isFinite(c.lng))return;const m=L.marker([c.lat,c.lng],{icon:makePinIcon(d),title:d.id,alt:`${d.id} lokasi simulasi`}).addTo(leafletMap);m.bindPopup(popupContent(d));m.on('click',()=>{selectedDevice=d.id;renderGeoDetail(d.id)});leafletMarkers[d.id]=m});if(visible.length>1){const group=L.featureGroup(Object.values(leafletMarkers));leafletMap.fitBounds(group.getBounds().pad(.18),{maxZoom:13})}else if(visible.length===1){const c=deviceCoords(visible[0]);leafletMap.setView([c.lat,c.lng],14)}setTimeout(()=>leafletMap&&leafletMap.invalidateSize(),120);
}catch(err){el.innerHTML='<div class="empty">Peta gagal diinisialisasi. Muat ulang halaman dan periksa koneksi internet.</div>';console.error('Leaflet init error',err)}}
function renderGeoDetail(id){const d=devices.find(x=>x.id===id);if(!d)return;const root=$('#geoDeviceDetail');if(!root)return;const c=deviceCoords(d),a=activeAlertFor(id);root.innerHTML=`<div class="device-detail"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><div class="sub">${esc(d.zone)}</div><h2 style="font-size:24px;margin:2px 0">${d.id}</h2></div>${badge(statusOf(d))}</div><div class="detail-grid"><div class="detail-item"><span>Suhu tanah</span><strong>${d.comm==='offline'?'—':d.temp.toFixed(1)+' °C'}</strong></div><div class="detail-item"><span>Debit air</span><strong>${d.comm==='offline'?'—':d.flow.toFixed(1)+' L/menit'}</strong></div><div class="detail-item"><span>Tekanan air</span><strong>${d.comm==='offline'?'—':d.pressure.toFixed(1)+' kPa'}</strong></div><div class="detail-item"><span>Komunikasi</span><strong>${d.comm==='offline'?'Luring':'Daring (simulasi)'}</strong></div><div class="detail-item"><span>Koordinat</span><strong>${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}</strong></div><div class="detail-item"><span>Data terakhir</span><strong>${fmtTime(d.lastUpdate)}</strong></div></div><div class="notice">SUMBER: DATA SIMULASI · Koordinat contoh, belum terverifikasi di lapangan.</div><button class="btn primary" style="width:100%" onclick="window.rimbaraDeviceDetail('${d.id}')">Lihat detail perangkat</button>${a?`<button class="btn" style="width:100%;margin-top:8px" onclick="window.rimbaraAlertDetail('${a.id}')">Lihat peringatan aktif</button>`:''}<button class="btn" style="width:100%;margin-top:8px" onclick="window.rimbaraEditCoords('${d.id}')">Ubah koordinat</button></div>`}
window.rimbaraEditCoords=id=>showCoordForm(id);
function showCoordForm(id='N01'){const d=devices.find(x=>x.id===id)||devices[0],c=deviceCoords(d);openModal('Lokasi perangkat · '+d.id,`<div class="notice">Masukkan koordinat hasil survei jika tersedia. Koordinat yang disimpan manual belum dianggap terverifikasi.</div><form id="coordForm"><div class="geo-form-grid"><div class="field"><label>ID perangkat</label><select name="deviceId">${devices.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${x.id}</option>`).join('')}</select></div><div class="field"><label>Nama zona</label><input name="zone" value="${esc(d.zone)}" required maxlength="100"></div><div class="field"><label>Latitude (-90 s.d. 90)</label><input name="lat" type="number" step="any" min="-90" max="90" value="${c.lat}" required></div><div class="field"><label>Longitude (-180 s.d. 180)</label><input name="lng" type="number" step="any" min="-180" max="180" value="${c.lng}" required></div><div class="field full"><label>Keterangan lokasi</label><input name="note" value="${esc(c.note||'Koordinat contoh demonstrasi')}" maxlength="200" placeholder="Contoh: titik hasil survei / lokasi simulasi"></div></div><button class="btn primary" type="submit">Simpan koordinat</button></form>`);$('#coordForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),devId=f.get('deviceId'),lat=Number(f.get('lat')),lng=Number(f.get('lng'));if(!devices.some(x=>x.id===devId)){toast('ID perangkat tidak terdaftar.',true);return}if(!Number.isFinite(lat)||lat < -90||lat>90||!Number.isFinite(lng)||lng < -180||lng>180){toast('Latitude/longitude di luar rentang valid.',true);return}const dev=devices.find(x=>x.id===devId);dev.zone=f.get('zone').trim();deviceSeed.find(x=>x.id===devId).zone=dev.zone;saveDeviceCoord(devId,lat,lng,f.get('note').trim()||'Koordinat manual belum terverifikasi');closeModal();toast('Koordinat perangkat disimpan secara lokal.');render()}}
function searchGeoLocation(){const q=$('#geoSearch')?.value.trim();if(!q)return;const out=$('#geoSearchResult');out.textContent='Mencari lokasi…';if(/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(q)){const [lat,lng]=q.split(',').map(Number);if(lat < -90||lat>90||lng < -180||lng>180){out.textContent='Koordinat di luar rentang yang valid.';return}geoCenter={lat,lng,label:'Koordinat pilihan pengguna'};localStorage.setItem('rimbara-map-center',JSON.stringify(geoCenter));leafletMap?.setView([lat,lng],13);out.textContent=`Peta dipusatkan ke ${lat.toFixed(5)}, ${lng.toFixed(5)}. Ini bukan lokasi pemasangan terverifikasi.`;return}fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(q),{headers:{'Accept-Language':'id'}}).then(r=>{if(!r.ok)throw new Error('Layanan geocoding tidak tersedia');return r.json()}).then(rows=>{if(!rows.length){out.textContent='Lokasi tidak ditemukan. Coba nama daerah lain atau masukkan koordinat secara manual.';return}out.innerHTML='';const wrap=document.createElement('div');wrap.className='geo-results';rows.forEach(row=>{const b=document.createElement('button');b.className='btn';b.style.cssText='display:block;width:100%;text-align:left;margin:5px 0;white-space:normal';b.textContent=row.display_name;b.onclick=()=>{const lat=Number(row.lat),lng=Number(row.lon);geoCenter={lat,lng,label:row.display_name};localStorage.setItem('rimbara-map-center',JSON.stringify(geoCenter));leafletMap?.setView([lat,lng],13);out.textContent='Peta dipusatkan pada hasil geocoding (bukan hasil survei lapangan).';};wrap.appendChild(b)});out.appendChild(wrap)}).catch(()=>{out.textContent='Pencarian lokasi gagal. Periksa koneksi internet atau masukkan koordinat latitude, longitude secara manual.'})}

let alerts=[],tasks=[],activities=[],seqAlert=4,seqTask=4,selectedDevice='N01',currentPage='home',simRunning=true,simTimer=null,chartRange='6h',chartDevice='N01',chartMetric='temp',mapFilter='all',deviceFilter='all',alertFilter='all',taskFilter='all',reportStart=new Date(Date.now()-7*86400000).toISOString().slice(0,10),reportEnd=now().toISOString().slice(0,10);
function statusOf(d){if(d.comm==='offline'||Date.now()-new Date(d.lastUpdate).getTime()>settings.staleMinutes*60000)return'offline';if(d.temp>=settings.tempThreshold||d.flow<settings.minFlow||d.pressure<settings.pressureMin||d.pressure>settings.pressureMax)return d.temp>=settings.tempThreshold?'critical':'attention';if(d.temp>=settings.tempThreshold-2||d.pressure>settings.pressureMax-10)return'attention';return'normal'}
function statusLabel(s){return({normal:'Normal',attention:'Perlu perhatian',critical:'Prioritas tinggi',offline:'Luring'})[s]||s}
function badge(s){return `<span class="status ${s}">${statusLabel(s)}</span>`}
function addActivity(type,ref,desc){activities.unshift({id:'ACT-'+String(activities.length+1).padStart(3,'0'),time:now().toISOString(),type,ref,desc});}
function toast(msg,error=false){let el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3400)}
function saveSettings(){localStorage.setItem('rimbara-settings',JSON.stringify(settings))}
function evaluateAlerts(){let candidates=[];devices.forEach(d=>{if(d.comm==='offline'){candidates.push({device:d,type:'Data perangkat kedaluwarsa',value:`Data terakhir ${Math.round((Date.now()-new Date(d.lastUpdate).getTime())/60000)} menit lalu`,priority:'Tinggi',key:'offline'});return}
if(d.temp>=settings.tempThreshold)candidates.push({device:d,type:'Suhu tanah melampaui ambang',value:`${d.temp.toFixed(1)} °C`,priority:'Tinggi',key:'temp'});
else if(d.temp>=settings.tempThreshold-2)candidates.push({device:d,type:'Tren suhu perlu diverifikasi',value:`${d.temp.toFixed(1)} °C`,priority:'Sedang',key:'trend'});
if(d.flow<settings.minFlow)candidates.push({device:d,type:'Debit air di bawah batas',value:`${d.flow.toFixed(1)} L/menit`,priority:'Tinggi',key:'flow'});
if(d.pressure>0&&(d.pressure<settings.pressureMin||d.pressure>settings.pressureMax))candidates.push({device:d,type:'Tekanan air di luar rentang',value:`${d.pressure.toFixed(1)} kPa`,priority:'Sedang',key:'pressure'});});
candidates.forEach(c=>{if(!alerts.some(a=>a.deviceId===c.device.id&&a.key===c.key&&a.status!=='Selesai')){let a={id:'ALT-'+String(seqAlert++).padStart(3,'0'),time:now().toISOString(),deviceId:c.device.id,zone:c.device.zone,type:c.type,value:c.value,priority:c.priority,status:'Baru',key:c.key,detail:'Indikasi berdasarkan aturan ambang simulasi. Verifikasi kondisi di lapangan sebelum mengambil kesimpulan.'};alerts.unshift(a);addActivity('Peringatan baru',a.id,`${a.type} pada ${a.deviceId}`)}})}
function seedData(){alerts=[];tasks=[];activities=[];seqAlert=1;seqTask=1;devices=deviceSeed.map(d=>({...d,lastUpdate:isoAgo(d.age),history:Array.from({length:24},(_,i)=>({t:new Date(Date.now()-(23-i)*15*60000).toISOString(),temp:+(d.temp+Math.sin(i*.42+d.x)*1.15+(i/23)*.4).toFixed(1),flow:Math.max(0,+(d.flow+Math.cos(i*.5+d.y)*4).toFixed(1)),pressure:Math.max(0,+(d.pressure+Math.sin(i*.4)*7).toFixed(1))}))}));evaluateAlerts();addActivity('Sistem','DEMO','Data demo diinisialisasi');render()}
function summary(){let active=devices.filter(d=>d.comm==='online'),online=active.length,temps=active.map(d=>d.temp),flows=active.map(d=>d.flow),press=active.filter(d=>d.pressure>0).map(d=>d.pressure);return{avgTemp:temps.reduce((a,b)=>a+b,0)/(temps.length||1),flow:flows.reduce((a,b)=>a+b,0),avgPressure:press.reduce((a,b)=>a+b,0)/(press.length||1),online,offline:devices.length-online,alerts:alerts.filter(a=>a.status!=='Selesai').length,activeTasks:tasks.filter(t=>t.status!=='Selesai').length}}
function pathLine(data,w,h,min,max){let span=max-min||1;return data.map((v,i)=>`${i?'L':'M'} ${(i*w/Math.max(1,data.length-1)).toFixed(1)} ${(h-((v-min)/span)*h).toFixed(1)}`).join(' ')}
function chartSVG(series,opts={}){let w=640,h=200,pad={l:30,r:10,t:12,b:24},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;let all=series.flatMap(s=>s.values);if(!all.length)return'<div class="empty">Belum ada data grafik.</div>';let min=opts.min??Math.floor(Math.min(...all)-2),max=opts.max??Math.ceil(Math.max(...all)+2);if(max===min)max=min+1;let lines=series.map((s,idx)=>{let path=s.values.map((v,i)=>`${i?'L':'M'} ${(pad.l+i*cw/Math.max(1,s.values.length-1)).toFixed(1)} ${(pad.t+ch-(v-min)/(max-min)*ch).toFixed(1)}`).join(' ');let color=['#2d8a58','#d39a2e','#5687bb'][idx%3];let last=s.values[s.values.length-1];return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"><title>${esc(s.name)}: ${last}</title></path><circle cx="${pad.l+cw}" cy="${pad.t+ch-(last-min)/(max-min)*ch}" r="4" fill="${color}"/>`}).join('');let grid=[0,.25,.5,.75,1].map(r=>{let y=pad.t+ch*r,val=max-(max-min)*r;return `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#e9efeb" stroke-dasharray="3 4"/><text x="${pad.l-7}" y="${y+4}" font-size="10" fill="#8a968e" text-anchor="end">${val.toFixed(0)}</text>`}).join('');let labels=[0,Math.floor((series[0].values.length-1)/2),series[0].values.length-1].map((idx,i)=>`<text x="${pad.l+idx*cw/Math.max(1,series[0].values.length-1)}" y="${h-5}" text-anchor="${i===0?'start':i===2?'end':'middle'}" font-size="10" fill="#8a968e">${['-6j','-3j','Kini'][i]}</text>`).join('');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Grafik simulasi">${grid}${lines}${labels}</svg>`}
function chartFor(metric='temp',devId='N01',range='6h'){let d=devices.find(x=>x.id===devId)||devices[0],count=range==='1h'?5:range==='24h'?24:13;let history=d.history.slice(-count);let key=metric==='temp'?'temp':metric==='flow'?'flow':'pressure';let values=history.map(h=>h[key]);return{values,series:[{name:d.id,values}],last:values.at(-1),min:Math.min(...values),max:Math.max(...values)}}
function pageHeader(title,desc,action=''){return `<div class="welcome"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function statCard(label,value,unit,icon,foot,page,filter){return `<div class="stat" role="button" tabindex="0" data-goto="${page}" ${filter?`data-filter="${filter}"`:''}><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}<span style="font-size:12px;font-weight:650;color:#718078"> ${unit||''}</span></div><div class="stat-foot">${foot}</div></div>`}
function recentAlertCards(limit=4){let list=alerts.filter(a=>a.status!=='Selesai').slice(0,limit);return list.length?list.map(a=>`<div class="alert-card ${a.priority==='Tinggi'?'high':''}" data-alert="${a.id}" role="button" tabindex="0"><div style="display:flex;justify-content:space-between;gap:8px"><h4>${esc(a.type)}</h4><span class="pill">${esc(a.priority)}</span></div><p>${a.deviceId} · ${esc(a.zone)} · ${esc(a.value)}</p><div class="alert-meta"><span>${fmtTime(a.time)}</span><span>${esc(a.status)} →</span></div></div>`).join(''):'<div class="empty">Tidak ada peringatan aktif. Kondisi simulasi dalam batas yang dikonfigurasi.</div>'}
function deviceTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Perangkat</th><th>Zona</th><th>Suhu</th><th>Debit</th><th>Tekanan</th><th>Komunikasi</th><th>Status</th><th>Data terakhir</th><th>Aksi</th></tr></thead><tbody>${rows.map(d=>`<tr><td><strong>${d.id}</strong></td><td>${esc(d.zone)}</td><td>${d.comm==='offline'?'—':d.temp.toFixed(1)+' °C'}</td><td>${d.comm==='offline'?'—':d.flow.toFixed(1)+' L/mnt'}</td><td>${d.comm==='offline'?'—':d.pressure.toFixed(1)+' kPa'}</td><td>${badge(d.comm==='offline'?'offline':'normal')}</td><td>${badge(statusOf(d))}</td><td>${fmtTime(d.lastUpdate)}</td><td><button class="btn small" data-device="${d.id}">Detail</button> <button class="btn small" data-show-map="${d.id}">Peta</button></td></tr>`).join('')}</tbody></table></div>`}
function renderHome(){let s=summary(),active=devices.filter(d=>d.comm==='online'),drows=devices.filter(d=>statusOf(d)!=='normal');return `${pageHeader('Dashboard Pemantauan Gambut','Ringkasan kondisi pemantauan area gambut dan distribusi air.','<button class="btn" id="toggleSim">'+(simRunning?'Ⅱ Jeda simulasi':'▶ Lanjutkan simulasi')+'</button>')}<div class="demo-banner"><span>⚠</span><div><strong>MODE DEMO — DATA SIMULASI, BUKAN DATA LAPANGAN.</strong><br><span>Nilai, lokasi, peringatan, dan pembaruan di bawah ini bersifat ilustratif; bukan hasil pembacaan sensor fisik.</span></div></div><div class="grid stats">${statCard('Suhu tanah rata-rata',s.avgTemp.toFixed(1),'°C','♨','Rata-rata perangkat daring','analytics')}${statCard('Debit air total',s.flow.toFixed(0),'L/menit','≈','Total debit simulasi','analytics')}${statCard('Tekanan air rata-rata',s.avgPressure.toFixed(0),'kPa','◉','Dari perangkat dengan data','analytics')}${statCard('Perangkat daring',s.online+'/'+devices.length,'unit','⌁',s.offline+' perangkat luring','devices','offline')}${statCard('Perangkat terdaftar',devices.length,'unit','▦','Titik simulasi N01–N06','map')}${statCard('Peringatan aktif',s.alerts,'item','⚑','Perlu verifikasi petugas','alerts')}</div><div class="grid cols2"><section class="panel"><div class="panel-head"><div><h2>Tren suhu tanah</h2><div class="sub">Perubahan ilustratif pada perangkat N01–N06</div></div><button class="linkbtn" data-goto="analytics">Analisis lengkap →</button></div><div class="chart">${chartSVG(devices.filter(d=>d.comm==='online').slice(0,3).map(d=>({name:d.id,values:d.history.slice(-13).map(h=>h.temp)})),{min:25,max:43})}</div><div class="legend"><span><i style="background:#2d8a58"></i>N01</span><span><i style="background:#d39a2e"></i>N02</span><span><i style="background:#5687bb"></i>N03</span></div></section><section class="panel"><div class="panel-head"><div><h2>Distribusi air</h2><div class="sub">Debit per perangkat (L/menit)</div></div><button class="linkbtn" data-goto="analytics">Lihat data →</button></div><div class="chart">${chartSVG(devices.map(d=>({name:d.id,values:d.history.slice(-13).map(h=>h.flow)})),{min:0,max:65})}</div><div class="legend"><span><i style="background:#2d8a58"></i>Debit air</span><span class="sub">Nilai nol dapat menunjukkan gangguan atau data simulasi.</span></div></section></div><div class="grid cols2"><section class="panel"><div class="panel-head"><div><h2>Perangkat yang membutuhkan perhatian</h2><div class="sub">${drows.length} perangkat dengan status selain normal</div></div><button class="linkbtn" data-goto="devices">Semua perangkat →</button></div>${drows.length?deviceTable(drows):'<div class="empty">Semua perangkat simulasi berstatus normal.</div>'}</section><section class="panel"><div class="panel-head"><div><h2>Peringatan terbaru</h2><div class="sub">Indikasi potensi bahaya, perlu verifikasi</div></div><button class="linkbtn" data-goto="alerts">Lihat semua →</button></div>${recentAlertCards(4)}</section></div><section class="panel"><div class="panel-head"><div><h2>Ringkasan tugas lapangan</h2><div class="sub">Koordinasi tugas hanya tersimpan di prototipe lokal</div></div><button class="btn small" data-goto="tasks">Kelola tugas →</button></div>${tasks.length?tasks.slice(0,3).map(taskCard).join(''):'<div class="empty">Belum ada tugas. Buat tugas pemeriksaan dari menu Tugas Lapangan atau dari detail peringatan.</div>'}</section>`}

function renderAnalytics(){let d=devices.find(x=>x.id===chartDevice)||devices[0],metric=chartMetric,chart=chartFor(metric,chartDevice,chartRange),unit=metric==='temp'?'°C':metric==='flow'?'L/menit':'kPa',label=metric==='temp'?'Suhu tanah':metric==='flow'?'Debit air':'Tekanan air';let selected=d.comm==='offline'?'Data perangkat luring; grafik berikut menunjukkan histori simulasi terakhir, bukan pembacaan terkini.':`Data simulasi ${d.id} · kedalaman ${d.depth}`;return `${pageHeader('Data dan Grafik','Analisis perubahan suhu tanah, debit air, dan tekanan air.')}<div class="demo-banner"><span>▥</span><div><strong>ANALISIS SIMULASI</strong><br><span>Ambang dan rentang operasi dapat diubah di Pengaturan untuk menguji respons sistem.</span></div></div><section class="panel"><div class="panel-head"><div><h2>Parameter analisis</h2><div class="sub">Filter memperbarui grafik dan statistik di bawah.</div></div></div><div class="filters"><select id="chartDevice">${devices.map(x=>`<option value="${x.id}" ${x.id===chartDevice?'selected':''}>${x.id} · ${x.zone}</option>`).join('')}</select><select id="chartMetric"><option value="temp" ${metric==='temp'?'selected':''}>Suhu tanah</option><option value="flow" ${metric==='flow'?'selected':''}>Debit air</option><option value="pressure" ${metric==='pressure'?'selected':''}>Tekanan air</option></select><select id="chartRange"><option value="1h" ${chartRange==='1h'?'selected':''}>1 jam</option><option value="6h" ${chartRange==='6h'?'selected':''}>6 jam</option><option value="24h" ${chartRange==='24h'?'selected':''}>24 jam</option></select></div><div class="notice">${selected}</div><div class="grid stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat" style="cursor:default"><div class="stat-top">Nilai terakhir <span class="stat-icon">◉</span></div><div class="stat-value">${chart.last.toFixed(1)}<span style="font-size:12px;color:var(--muted)"> ${unit}</span></div><div class="stat-foot">Pada histori simulasi</div></div><div class="stat" style="cursor:default"><div class="stat-top">Nilai tertinggi <span class="stat-icon">↑</span></div><div class="stat-value">${chart.max.toFixed(1)}<span style="font-size:12px;color:var(--muted)"> ${unit}</span></div><div class="stat-foot">Dalam rentang terpilih</div></div><div class="stat" style="cursor:default"><div class="stat-top">Status aturan <span class="stat-icon">⚑</span></div><div class="stat-value" style="font-size:19px">${metric==='temp'?(chart.last>=settings.tempThreshold?'Melewati ambang':chart.last>=settings.tempThreshold-2?'Perlu verifikasi':'Dalam batas'):metric==='flow'?(chart.last<settings.minFlow?'Debit rendah':'Dalam batas'):(chart.last<settings.pressureMin||chart.last>settings.pressureMax?'Di luar rentang':'Dalam batas')}</div><div class="stat-foot">Aturan simulasi lokal</div></div></div><div class="panel-head"><div><h2>${label} · ${d.id}</h2><div class="sub">Satuan ${unit} · data berkala simulasi</div></div><span class="pill">${chartRange}</span></div><div class="chart" style="height:300px">${chartSVG([{name:label,values:chart.values}],{min:Math.max(0,Math.floor(chart.min-3)),max:Math.ceil(chart.max+3)})}</div><div class="legend"><span><i style="background:#2d8a58"></i>${label}</span><span class="sub">Grafik diperbarui saat filter diubah atau simulasi berjalan.</span></div></section><div class="grid cols2"><section class="panel"><div class="panel-head"><div><h2>Distribusi air per perangkat</h2><div class="sub">Debit air (L/menit)</div></div></div><div class="chart">${chartSVG(devices.map(x=>({name:x.id,values:x.history.slice(-12).map(h=>h.flow)})),{min:0,max:65})}</div></section><section class="panel"><div class="panel-head"><div><h2>Tekanan air per perangkat</h2><div class="sub">Tekanan (kPa)</div></div></div><div class="chart">${chartSVG(devices.map(x=>({name:x.id,values:x.history.slice(-12).map(h=>h.pressure)})),{min:0,max:210})}</div><div class="notice">Debit terlalu rendah atau tekanan di luar rentang dapat mengindikasik function createTask(deviceId='',alertId=''){let d=devices.find(x=>x.id===deviceId)||devices[0];openModal('Buat tugas pemeriksaan',`<form id="createTaskForm"><div class="form-grid"><div class="field"><label>Perangkat</label><select name="deviceId">${devices.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${x.id} · ${x.zone}</option>`).join('')}</select></div><div class="field"><label>Jenis pemeriksaan</label><select name="type"><option>Pemeriksaan distribusi air</option><option>Verifikasi suhu tanah</option><option>Pemeriksaan sensor dan komunikasi</option><option>Pemeriksaan umum area</option></select></div><div class="field"><label>Prioritas</label><select name="priority"><option>Sedang</option><option>Tinggi</option><option>Rendah</option></select></div><div class="field"><label>Nama petugas</label><input name="assignee" required placeholder="Nama petugas demo"></div><div class="field full"><label>Catatan instruksi</label><textarea name="notes" placeholder="Instruksi pemeriksaan…">${alertId?'Verifikasi peringatan '+alertId+'. ':''}</textarea></div></div><button class="btn primary" type="submit">Simpan tugas demo</button></form>`);$('#createTaskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),id='TSK-'+String(seqTask++).padStart(3,'0'),dev=devices.find(x=>x.id===f.get('deviceId'));tasks.unshift({id,deviceId:dev.id,zone:dev.zone,type:f.get('type'),priority:f.get('priority'),assignee:f.get('assignee').trim(),notes:f.get('notes').trim(),status:'Ditugaskan',createdAt:now().toISOString(),alertId,results:null});addActivity('Petugas ditugaskan',id,`${dev.id} ditugaskan kepada ${f.get('assignee').trim()}`);closeModal();toast('Tugas '+id+' berhasil dibuat di simulasi.');goto('tasks')}}
function taskDetail(id){let t=tasks.find(x=>x.id===id);if(!t)return;openModal('Detail tugas · '+t.id,`<div class="notice">Data tugas tersimpan lokal pada prototipe ini.</div><div class="detail-grid"><div class="detail-item"><span>Perangkat / zona</span><strong>${t.deviceId} · ${esc(t.zone)}</strong></div><div class="detail-item"><span>Jenis pemeriksaan</span><strong>${esc(t.type)}</strong></div><div class="detail-item"><span>Petugas</span><strong>${esc(t.assignee)}</strong></div><div class="detail-item"><span>Prioritas</span><strong>${esc(t.priority)}</strong></div><div class="detail-item"><span>Status</span><strong>${esc(t.status)}</strong></div><div class="detail-item"><span>Waktu penugasan</span><strong>${fmtTime(t.createdAt)}</strong></div></div><p><strong>Instruksi:</strong> ${esc(t.notes||'—')}</p>${t.results?`<div class="notice"><strong>Hasil pemeriksaan tersimpan</strong><br>${esc(t.results.findings||'')}<br>${esc(t.results.action||'')}</div>`:''}<form id="taskResultForm"><div class="field"><label>Perbarui status</label><select name="status">${['Menunggu','Ditugaskan','Sedang Diperiksa','Selesai'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Catatan kondisi perangkat</label><input name="condition" value="${esc(t.results?.condition||'')}" placeholder="Kondisi yang diperiksa"></div><div class="form-grid"><div class="field"><label>Suhu yang diperiksa (°C)</label><input name="temp" type="number" step=".1" value="${esc(t.results?.temp||'')}" placeholder="Opsional"></div><div class="field"><label>Kondisi distribusi air</label><select name="water"><option value="">Belum dicatat</option>${['Normal','Debit rendah','Tekanan rendah','Tekanan tinggi','Tidak ada aliran'].map(s=>`<option ${t.results?.water===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label>Temuan lapangan (simulasi)</label><textarea name="findings">${esc(t.results?.findings||'')}</textarea></div><div class="field full"><label>Tindakan yang dilakukan</label><textarea name="action">${esc(t.results?.action||'')}</textarea></div><div class="field full"><label>Catatan tambahan</label><textarea name="extra">${esc(t.results?.extra||'')}</textarea></div><div class="field full"><label>Foto (opsional, metadata lokal)</label><input type="file" name="photo" accept="image/*"><small>Foto tidak diunggah ke server; hanya nama file dicatat dalam sesi prototipe.</small></div></div><button class="btn primary" type="submit">Simpan hasil dan status</button></form>`);$('#taskResultForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),old=t.status;t.status=f.get('status');t.results={condition:f.get('condition'),temp:f.get('temp'),water:f.get('water'),findings:f.get('findings'),action:f.get('action'),extra:f.get('extra'),photo:f.get('photo')?.name||t.results?.photo||''};addActivity('Status tugas diperbarui',t.id,`${old} → ${t.status}`);if(t.status==='Selesai')addActivity('Pemeriksaan selesai',t.id,`Pemeriksaan ${t.deviceId} ditandai selesai`);closeModal();toast('Perubahan tugas tersimpan.');render()}}
function alertDetail(id){let a=alerts.find(x=>x.id===id);if(!a)return;openModal('Detail peringatan · '+a.id,`<div class="detail-grid"><div class="detail-item"><span>Waktu kejadian</span><strong>${fmtTime(a.time)}</strong></div><div class="detail-item"><span>Perangkat / zona</span><strong>${a.deviceId} · ${esc(a.zone)}</strong></div><div class="detail-item"><span>Jenis</span><strong>${esc(a.type)}</strong></div><div class="detail-item"><span>Nilai</span><strong>${esc(a.value)}</strong></div><div class="detail-item"><span>Prioritas</span><strong>${esc(a.priority)}</strong></div><div class="detail-item"><span>Status</span><strong>${esc(a.status)}</strong></div></div><div class="notice">${esc(a.detail)}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="alertCreateTask">＋ Buat tugas pemeriksaan</button><button class="btn" id="alertInvestigate">Tandai sedang diperiksa</button><button class="btn" id="alertResolve">Tandai selesai</button></div>`);$('#alertCreateTask').onclick=()=>{closeModal();createTask(a.deviceId,a.id)};$('#alertInvestigate').onclick=()=>updateAlert(a.id,'Sedang Diperiksa');$('#alertResolve').onclick=()=>updateAlert(a.id,'Selesai')}

function csvDownload(name,rows){let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);toast('File CSV disiapkan.')}

function startSim(){stopSim();simTimer=setInterval(()=>{if(!simRunning)return;devices.forEach(d=>{if(d.comm==='offline')return;d.temp=Math.max(27,Math.min(44,+(d.temp+(Math.random()-.48)*.55).toFixed(1)));d.flow=Math.max(0,Math.min(65,+(d.flow+(Math.random()-.5)*2.8).toFixed(1)));d.pressure=Math.max(0,Math.min(220,+(d.pressure+(Math.random()-.5)*3.5).toFixed(1)));d.lastUpdate=now().toISOString();d.history.push({t:d.lastUpdate,temp:d.temp,flow:d.flow,pressure:d.pressure});if(d.history.length>48)d.history.shift()});evaluateAlerts();if(currentPage==='home'||currentPage==='analytics'||currentPage==='map'||currentPage==='devices'||currentPage==='alerts'||currentPage==='reports')render();$('#clock').textContent=now().toLocaleString('id-ID',{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});},12000)}

$('#profileEdit').onclick=()=>goto('settings');$('#profileSettings').onclick=()=>goto('settings');$('#aboutBtn').onclick=()=>{ $('#profileMenu').classList.add('hidden');openModal('Tentang RIMBARA MONITOR',`<div class="notice">MODE DEMO — DATA SIMULASI, BUKAN DATA LAPANGAN.</div><p>RIMBARA (Rancang Inovasi Monitoring Bahaya dan Respons Aman) adalah konsep platform untuk mendemonstrasikan pemantauan kondisi gambut, distribusi air, indikasi potensi bahaya, dan koordinasi pemeriksaan.</p><p>Versi ini berjalan tanpa backend. Pengaturan disimpan pada localStorage browser, sementara data tugas dan aktivitas berada dalam memori sesi. Integrasi sensor nyata membutuhkan perangkat, API/MQTT, backend, keamanan, dan validasi lapangan.</p>`,'<button class="btn primary" id="aboutOk">Mengerti</button>');$('#aboutOk').onclick=closeModal};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#profileMenu').classList.add('hidden');$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')}});
$('#clock').textContent=now().toLocaleString('id-ID',{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
seedData();render();startSim();
</script>
